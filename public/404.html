<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Canadian Go</title>
    <!-- GitHub Pages has no server-side rewrites, so a direct hit on a route
         like /city-league 404s. This stashes the intended path and bounces to
         the SPA shell, which restores it (see the script in index.html). -->
    <script>
      sessionStorage.redirect = location.href
    </script>
    <meta http-equiv="refresh" content="0;URL='/'" />
  </head>
  <body></body>
</html>
